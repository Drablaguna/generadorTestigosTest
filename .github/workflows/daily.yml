name: Daily Screenshot

on:
  schedule:
    - cron: "0 21 * * 1-5"   # Mon-Fri 16:00 Cancun (21:00 UTC)
    - cron: "0 17 * * 6"     # Sat 12:00 Cancun (17:00 UTC)
    - cron: "0 14 * * 0"     # Sun 09:00 Cancun (14:00 UTC)
  workflow_dispatch:          # Manual trigger

jobs:
  screenshot:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4️⃣ Explicitly install Puppeteer Chromium
      - name: Install Puppeteer Chromium
        run: npx puppeteer install

      # 5️⃣ Cache Puppeteer Chromium for future runs
      - name: Cache Puppeteer Chromium
        uses: actions/cache@v3
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-

      # 6️⃣ Run screenshot script
      - name: Run screenshot script
        run: node index.js
        env:
          PUPPETEER_CACHE_DIR: ~/.cache/puppeteer
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
